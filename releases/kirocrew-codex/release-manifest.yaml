    bundle_files:
      allowlist: releases/kirocrew-codex/allowlist.txt
      count: 4416
      sha256: 14954cf7cd315b958838a4794b43072bf9692530733643fed87ab676d10f9769
    excluded:
      - release binaries and installers
      - runtime data, sessions, logs, credentials, and local configuration
      - ignored build caches and dependency directories
      - Telegram preview and owner communication history
    decision: BLOCK
    blockers:
      - modified upstream files do not yet carry the prominent modification notices required by Apache-2.0 section 4(b)
      - current repository, product, executable, and visual branding use marks excluded from the upstream software license
      - public privacy copy conflicts with the hard-disabled outbound telemetry behavior
      - the default embedding-model CDN request is documented as an attributable first-install signal
      - local usage records need explicit opt-out, retention, and owner-only file permissions
      - public workflows and install documentation still contain upstream-specific infrastructure and stale instructions
      - the public Build run exposes unsigned wheel and desktop CI artifacts despite source-only distribution claims
      - published ancestry retains a corporate email address and needs an approved provenance-preserving history strategy
    notes: The source-only prerelease existed before this manifest; this record is a transparent governance backfill.

